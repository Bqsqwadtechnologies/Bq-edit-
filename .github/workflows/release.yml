name: BQ Pro Edit Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BQ_RELEASE_STORE_FILE: ${{ github.workspace }}/signing/bq-pro-edit-release.jks
      BQ_RELEASE_STORE_PASSWORD: ${{ secrets.BQ_RELEASE_STORE_PASSWORD }}
      BQ_RELEASE_KEY_ALIAS: ${{ secrets.BQ_RELEASE_KEY_ALIAS }}
      BQ_RELEASE_KEY_PASSWORD: ${{ secrets.BQ_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release signing keystore
        env:
          BQ_RELEASE_KEYSTORE_BASE64: ${{ secrets.BQ_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$BQ_RELEASE_KEYSTORE_BASE64"
          mkdir -p "$(dirname "$BQ_RELEASE_STORE_FILE")"
          python3 - "$BQ_RELEASE_STORE_FILE" <<'PY'
          import base64
          import binascii
          import os
          import sys

          value = "".join(os.environ["BQ_RELEASE_KEYSTORE_BASE64"].split())
          value += "=" * (-len(value) % 4)
          try:
              data = base64.b64decode(value, validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit(f"Invalid keystore Base64: {exc}")
          if not data:
              raise SystemExit("Decoded keystore is empty")
          with open(sys.argv[1], "wb") as f:
              f.write(data)
          PY
          test -s "$BQ_RELEASE_STORE_FILE"
          chmod 600 "$BQ_RELEASE_STORE_FILE"

      - name: Verify release signing configuration
        run: |
          set -euo pipefail
          test -n "$BQ_RELEASE_STORE_PASSWORD"
          test -n "$BQ_RELEASE_KEY_ALIAS"
          test -n "$BQ_RELEASE_KEY_PASSWORD"
          test -f "$BQ_RELEASE_STORE_FILE"
          keytool -list -keystore "$BQ_RELEASE_STORE_FILE" -storepass "$BQ_RELEASE_STORE_PASSWORD" -alias "$BQ_RELEASE_KEY_ALIAS" >/dev/null
          echo "Release keystore, alias, and password verified."

      - name: Build signed release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon --warning-mode=all

      - name: Verify signed release APK and AAB
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$APK"
          test -n "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
