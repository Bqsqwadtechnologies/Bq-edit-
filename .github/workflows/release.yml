name: BQ Pro Edit Debug Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug build test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAVA_TOOL_OPTIONS: -Xshare:off

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify project
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Commit: $(git rev-parse HEAD)"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bq-pro-edit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
