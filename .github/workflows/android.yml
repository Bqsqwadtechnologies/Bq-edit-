name: BQ Pro Edit Android Build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run JVM unit tests before packaging
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bq-pro-edit-main-build
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main only
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Scan repository integrity
        id: integrity
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p build/ci-diagnostics
          : > build/ci-diagnostics/failures.txt
          check() {
            label="$1"
            shift
            echo "=== CHECK: $label ==="
            "$@"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$label (exit $rc)" | tee -a build/ci-diagnostics/failures.txt
            fi
            return 0
          }
          check "Expected workflow branch is main" test "$GITHUB_REF_NAME" = "main"
          check "settings.gradle.kts exists" test -f settings.gradle.kts
          check "app/build.gradle.kts exists" test -f app/build.gradle.kts
          check "AndroidManifest.xml exists" test -f app/src/main/AndroidManifest.xml
          check "Application ID com.bqsqwad.proedit is present" grep -R "com.bqsqwad.proedit" -n app/src/main
          check "Git HEAD matches workflow SHA" test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "=== INTEGRITY SCAN COMPLETE ==="

      - name: Run all Gradle checks and builds
        id: gradle_checks
        continue-on-error: true
        shell: bash
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          set +e
          set -o pipefail
          mkdir -p build/ci-diagnostics
          : > build/ci-diagnostics/gradle-failures.txt

          run_gradle() {
            label="$1"
            logfile="$2"
            shift 2
            echo
            echo "============================================================"
            echo "START: $label"
            echo "============================================================"
            "$@" 2>&1 | tee "$logfile"
            rc=$?
            echo "END: $label (exit $rc)"
            if [ "$rc" -ne 0 ]; then
              echo "$label (exit $rc)" | tee -a build/ci-diagnostics/gradle-failures.txt
            fi
            return 0
          }

          if [ "$RUN_TESTS" != "false" ]; then
            run_gradle "JVM unit tests" testDebugUnitTest.log gradle :app:testDebugUnitTest --stacktrace --continue --no-daemon
          fi

          run_gradle "Debug APK" assembleDebug.log gradle :app:assembleDebug --stacktrace --continue --no-daemon
          run_gradle "Release APK" assembleRelease.log gradle :app:assembleRelease --stacktrace --continue --no-daemon
          run_gradle "Release AAB" bundleRelease.log gradle :app:bundleRelease --stacktrace --continue --no-daemon

          echo
          echo "============================================================"
          echo "ALL GRADLE CHECKS AND BUILDS HAVE BEEN EXECUTED"
          echo "============================================================"
          cat build/ci-diagnostics/gradle-failures.txt 2>/dev/null || true

      - name: Verify real outputs
        id: outputs
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p build/ci-diagnostics
          : > build/ci-diagnostics/output-failures.txt
          debug_count=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" 2>/dev/null | wc -l)
          release_count=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" 2>/dev/null | wc -l)
          aab_count=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" 2>/dev/null | wc -l)
          [ "$debug_count" -gt 0 ] || echo "Debug APK missing" | tee -a build/ci-diagnostics/output-failures.txt
          [ "$release_count" -gt 0 ] || echo "Release APK missing" | tee -a build/ci-diagnostics/output-failures.txt
          [ "$aab_count" -gt 0 ] || echo "Release AAB missing" | tee -a build/ci-diagnostics/output-failures.txt
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true

      - name: Scan and summarize all collected errors
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/ci-diagnostics
          summary="build/ci-diagnostics/FINAL-BUILD-DIAGNOSTIC.txt"
          {
            echo "BQ Pro Edit complete build diagnostic"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "=== Repository integrity failures ==="
            cat build/ci-diagnostics/failures.txt 2>/dev/null || true
            echo
            echo "=== Gradle stage failures ==="
            cat build/ci-diagnostics/gradle-failures.txt 2>/dev/null || true
            echo
            echo "=== Output failures ==="
            cat build/ci-diagnostics/output-failures.txt 2>/dev/null || true
            echo
            echo "=== Error/Warning lines from Gradle logs ==="
            grep -RniE "error:|e: |FAILURE:|failed|exception|warning:" build/ci-diagnostics/*.log 2>/dev/null || true
          } | tee "$summary"

      - name: Upload complete build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-build-diagnostics
          path: build/ci-diagnostics/
          if-no-files-found: warn
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Final build result
        if: always()
        shell: bash
        run: |
          set +e
          failed=0
          for f in build/ci-diagnostics/failures.txt build/ci-diagnostics/gradle-failures.txt build/ci-diagnostics/output-failures.txt; do
            if [ -s "$f" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "BQ Pro Edit build FAILED after collecting all available diagnostics."
            exit 1
          fi
          echo "BQ Pro Edit build completed successfully."
