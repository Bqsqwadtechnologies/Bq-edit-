name: BQ Pro Edit Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bq-pro-edit-main-build
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify checked-out main commit
        run: |
          echo "Building main at $(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Verify Gradle version
        run: gradle --version

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          debug_apk=(app/build/outputs/apk/debug/*.apk)
          release_apk=(app/build/outputs/apk/release/*.apk)
          release_aab=(app/build/outputs/bundle/release/*.aab)
          test -s "${debug_apk[0]}"
          test -s "${release_apk[0]}"
          test -s "${release_aab[0]}"
          echo "Android debug APK, release APK, and release AAB verified from main"
          printf '%s\n' "${debug_apk[@]}" "${release_apk[@]}" "${release_aab[@]}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bq-pro-edit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bq-pro-edit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: bq-pro-edit-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
