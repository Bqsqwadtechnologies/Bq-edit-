name: BQ Pro Edit Android Build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run JVM unit tests before packaging
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bq-pro-edit-main-build
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main only
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify repository integrity
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          grep -R "com.bqsqwad.proedit" -n android/app/src/main | head

      - name: Run unit tests
        if: ${{ inputs.run_tests != false }}
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Build release AAB
        working-directory: android
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Verify real outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debug_apk=(android/app/build/outputs/apk/debug/*.apk)
          release_apk=(android/app/build/outputs/apk/release/*.apk)
          release_aab=(android/app/build/outputs/bundle/release/*.aab)
          ((${#debug_apk[@]} > 0)) && test -s "${debug_apk[0]}"
          ((${#release_apk[@]} > 0)) && test -s "${release_apk[0]}"
          ((${#release_aab[@]} > 0)) && test -s "${release_aab[0]}"
          printf 'Verified outputs:\n%s\n' "${debug_apk[@]}" "${release_apk[@]}" "${release_aab[@]}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bq-pro-edit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bq-pro-edit-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: bq-pro-edit-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
