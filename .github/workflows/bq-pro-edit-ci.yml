name: BQ Pro Edit Android CI

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run unit tests
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and test
        id: build
        continue-on-error: true
        shell: bash
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          set +e
          mkdir -p build/ci-diagnostics
          if [ "$RUN_TESTS" = "true" ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --continue --stacktrace --no-daemon 2>&1 | tee build/ci-diagnostics/gradle.log
          else
            ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --continue --stacktrace --no-daemon 2>&1 | tee build/ci-diagnostics/gradle.log
          fi
          rc=${PIPESTATUS[0]}
          echo "$rc" > build/ci-diagnostics/gradle-exit-code.txt
          exit 0

      - name: Check outputs
        id: outputs
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p build/ci-diagnostics
          : > build/ci-diagnostics/output-errors.txt
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit 2>/dev/null)" || echo "Debug APK missing" >> build/ci-diagnostics/output-errors.txt
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit 2>/dev/null)" || echo "Release APK missing" >> build/ci-diagnostics/output-errors.txt
          test -n "$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit 2>/dev/null)" || echo "Release AAB missing" >> build/ci-diagnostics/output-errors.txt
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print 2>/dev/null || true

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "BQ Pro Edit Android CI diagnostics"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo
            echo "=== Gradle exit code ==="
            cat build/ci-diagnostics/gradle-exit-code.txt 2>/dev/null || true
            echo
            echo "=== Output errors ==="
            cat build/ci-diagnostics/output-errors.txt 2>/dev/null || true
            echo
            echo "=== Gradle errors/warnings ==="
            grep -Ein "error:|e: |FAILURE:|failed|exception|warning:" build/ci-diagnostics/gradle.log 2>/dev/null || true
          } | tee build/ci-diagnostics/FINAL-DIAGNOSTIC.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-ci-diagnostics
          path: build/ci-diagnostics
          if-no-files-found: ignore

      - name: Upload APK
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release APK
        if: always() && hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload release AAB
        if: always() && hashFiles('app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v5
        with:
          name: bq-pro-edit-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Fail after diagnostics
        if: always()
        shell: bash
        run: |
          rc=$(cat build/ci-diagnostics/gradle-exit-code.txt 2>/dev/null || echo 1)
          if [ "$rc" != "0" ] || [ -s build/ci-diagnostics/output-errors.txt ]; then
            echo "Build failed. All available diagnostics were collected above."
            exit 1
          fi
          echo "Build, APK, and AAB checks passed."
